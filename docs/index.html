<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1638">
<meta name="description" content="БогоДел — игра, где вы бог, а ваш герой живёт сам. Развилки, дуэли богов, подземелья с отрядом.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="БогоДел">
<title>БогоДел — бог, которому не всё равно</title>
<style>
:root{
  --bg1:#14122b;--bg2:#2a1f45;--parch:#f6ecd4;--parch2:#efe0bd;--ink:#3a2a18;--ink2:#6b5233;
  --gold:#c9962b;--gold2:#e8c063;--red:#b8412f;--green:#4c8a3c;--blue:#3d6fa8;--purple:#7b4fa8;
  --shadow:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:#14122b}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(ellipse at top,#3b2c66 0%,var(--bg2) 35%,var(--bg1) 100%) fixed;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 10% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 70% 30%,#ffe 50%,transparent 51%),radial-gradient(1px 1px at 85% 80%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 50% 10%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 92% 12%,#fff 50%,transparent 51%);}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:40;padding:8px 14px 10px;
  background:linear-gradient(180deg,#1c1638fa,#221a42f5);border-bottom:2px solid var(--gold);color:#f3e6c4;box-shadow:var(--shadow)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hspacer{flex:1}
.logo{font-family:Georgia,serif;font-size:22px;color:var(--gold2);letter-spacing:.5px;white-space:nowrap}
.logo small{display:block;font-size:11px;color:#b9a77d;letter-spacing:0}
.godInfo{display:flex;flex-direction:column;min-width:0}
.godInfo b{font-size:15px}.godInfo span{font-size:12px;color:#cdb98b}
.hrow2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.5fr) minmax(0,1fr);gap:8px 12px;margin-top:8px;align-items:center}
.meter{position:relative;height:28px;border-radius:14px;background:#0b0a1c;overflow:hidden}
.meter>i{position:absolute;left:0;top:0;bottom:0;transition:width .3s;border-radius:14px 0 0 14px}
.meter>span{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:100%;padding:0 8px;
  font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter.faithM{border:2px solid #7fb4ff;box-shadow:0 0 12px #4a7bd088}
.meter.faithM>i{background:linear-gradient(90deg,#2f5fc0,#5f9ae8 60%,#a8dcff)}
.meter.gxpM{height:22px;border:1px solid #c9962b}
.meter.hpM{border:2px solid #ff8a7a;box-shadow:0 0 10px #c0392b77}
.meter.hpM>i{background:linear-gradient(90deg,#8e1f14,#d63a2a 60%,#ff7a5c)}
.meter.hpM>span small{font-weight:600;opacity:.85;margin-left:6px;font-size:.85em}
.meter.hpM.low{animation:hpLow 1.2s infinite}
.meter.hpM.dead{border-color:#777;box-shadow:none;background:#2a2a2a}
.meter.hpM.dead>i{background:#555}
.meter.hpM.hit{animation:hpHit .6s}
@keyframes hpHit{0%,100%{transform:none}20%{transform:translateX(-3px);box-shadow:0 0 0 4px #ff3b2a,0 0 18px #ff3b2a}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
@keyframes hpLow{0%,100%{box-shadow:0 0 6px #c0392b77}50%{box-shadow:0 0 14px #ff3b2a}}
.meter.gxpM>i{background:linear-gradient(90deg,#8a5c10,#e0b048)}
.meter.gxpM>span{font-size:12px}
.meter.flash{animation:flashRed .7s}
@keyframes flashRed{0%,100%{box-shadow:0 0 12px #4a7bd088}30%{box-shadow:0 0 0 4px #ff4a3a,0 0 18px #ff4a3a}}
.faithChip{display:inline-flex;align-items:center;gap:4px;background:#1f3a6e;color:#fff;border-radius:10px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.speed{display:flex;gap:4px;align-items:center;font-size:12px}
.speed button,.hbtn{background:#3a2e5e;color:#f3e6c4;border:1px solid #6b5a99;border-radius:8px;padding:5px 9px}
.speed button.on{background:var(--gold);color:#2a1d08;border-color:var(--gold2);font-weight:700}
.hbtn:hover,.speed button:hover{filter:brightness(1.2)}
.bar{height:10px;background:#00000033;border-radius:6px;overflow:hidden;border:1px solid #0003}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .3s}
.bar.hp>i{background:linear-gradient(90deg,#c0392b,#e74c3c)}
.bar.xp>i{background:linear-gradient(90deg,#6c8f2f,#a3c94a)}
.bar.faith>i{background:linear-gradient(90deg,#4a7bd0,#9fd0ff)}
.bar.gxp>i{background:linear-gradient(90deg,#b07a1c,#f0c860)}
.bar.trust>i{background:linear-gradient(90deg,#8a5cc0,#d29bff)}
.bar.quest>i{background:linear-gradient(90deg,#3b8a7a,#6fd6be)}
.bar.time>i{background:linear-gradient(90deg,#e67e22,#f1c40f);transition:width .25s linear}
main{display:grid;gap:18px;padding:18px;max-width:1280px;margin:0 auto;
  grid-template-columns:minmax(0,1fr) 390px;grid-template-areas:"center right";align-items:start}
#colCenter{grid-area:center;display:flex;flex-direction:column;gap:16px;min-width:0}#colRight{grid-area:right;position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));border-radius:14px;box-shadow:var(--shadow);padding:14px;border:1px solid #d9c290;position:relative}
.card h2{font-size:18px;color:#5a3b12;margin-bottom:8px;border-bottom:1px dashed #c8ad74;padding-bottom:6px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:4px 0}
.row span:first-child{color:var(--ink2)}
.muted{color:var(--ink2);font-size:12px}
.stat{margin:8px 0}.stat label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.inv{list-style:none;padding:0;margin:6px 0 0;font-size:13px;max-height:170px;overflow:auto}
.inv li{padding:2px 0;border-bottom:1px dotted #d4bd8b}
.btn{background:linear-gradient(180deg,#e8c063,#c9962b);color:#2b1d07;border:1px solid #a77b20;border-radius:9px;padding:7px 11px;font-weight:600;box-shadow:0 2px 0 #8a6418}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.btn.red{background:linear-gradient(180deg,#e0705c,#b8412f);color:#fff;border-color:#8c2e20;box-shadow:0 2px 0 #7a2618}
.btn.green{background:linear-gradient(180deg,#86c46d,#4c8a3c);color:#fff;border-color:#36662a;box-shadow:0 2px 0 #2f5a24}
.btn.blue{background:linear-gradient(180deg,#7fb0e8,#3d6fa8);color:#fff;border-color:#2c5280;box-shadow:0 2px 0 #24456b}
.btn.small{padding:4px 8px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* diary */
#diary{max-height:62vh;overflow:auto;padding-right:4px}
.entry{display:flex;gap:8px;padding:7px 4px;border-bottom:1px dotted #d1b985;font-size:14.5px;line-height:1.4;animation:fadeIn .5s}
.entry .tm{color:#9a7f55;font-size:11px;min-width:38px;padding-top:2px}
.entry.fight .tx{color:#7a2a1c}.entry.loot .tx{color:#5b4a08}.entry.god .tx{color:#244f8a;font-style:italic}
.entry.fork .tx{color:#5e2f86}.entry.duel .tx{color:#8a3a10}.entry.event .tx{color:#0f5d55;font-weight:600}.entry.level .tx{color:#2f6b20;font-weight:700}
.fx{font-size:12px;color:#7d6340;white-space:nowrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #e8c06388,var(--shadow)}50%{box-shadow:0 0 0 8px #e8c06300,var(--shadow)}}
/* voice */
.voice{display:flex;gap:6px;margin-bottom:8px}
.voice input{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid #c8ad74;background:#fffaf0;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{font-size:12px;padding:3px 8px;border-radius:12px;border:1px solid #c8ad74;background:#fff6e0;color:#5a3b12}
.chip:hover{background:#ffe9b8}
/* fork */
.card.fork{border:2px solid var(--purple);background:linear-gradient(180deg,#f7eefe,#eadcf6);animation:pulse 2s infinite}
.fork h2{color:#5e2f86;border-color:#b993dc}
.fork .q{font-size:15.5px;line-height:1.45;margin:6px 0 10px}
.fork .opts{display:flex;flex-direction:column;gap:7px}
.card.fork.mom{border:2px solid var(--gold);background:linear-gradient(180deg,#fffbef,#f7ecd0);animation:momIn 1.1s ease-out 2}
@keyframes momIn{0%{box-shadow:0 0 0 0 #e8b13ccc,var(--shadow)}70%{box-shadow:0 0 0 10px #e8b13c00,var(--shadow)}100%{box-shadow:var(--shadow)}}
.momh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.momh b{font-size:15px;color:#7a4e06}.fork:not(.mom) .momh b{color:#5e2f86}
.momt{font-size:12px;color:#7d6a4a;white-space:nowrap}
.fork.mom .q{margin:4px 0 8px}
.mopts{flex-direction:row!important;flex-wrap:wrap}
.mopts .btn{flex:1 1 200px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:40px}
.mopts .btn .ml{flex:1 1 auto}
.fork.mom .opts .btn{background:linear-gradient(180deg,#fff,#f6ead0);border-color:#c9a560;box-shadow:0 2px 0 #a8873e;color:#4a320a}
.fork .opts .btn.none{background:#fff;border-style:dashed;box-shadow:none;color:#6b5a44}
.fork .opts .btn:disabled{opacity:.55}
.tag.cost{background:#ffe7c2;color:#9a4a00;border:1px solid #f0b56a}.tag.chk{background:#e8f0ff;color:#2a4f8f;border:1px solid #a9c1ea}
.bar.time.thin{height:5px;margin-top:8px}
@media(max-width:560px){.mopts .btn{flex-basis:100%}}
.fork .opts .btn{text-align:left;background:linear-gradient(180deg,#fff,#efe4fb);border-color:#a37fcb;box-shadow:0 2px 0 #8a68b0;color:#3d1f5c}
.tag{font-size:11px;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.tag.kind{background:#fff1b8;color:#7a5b00}.tag.wrath{background:#ffd5cc;color:#8c2e20}.tag.neutral{background:#e3e3e3;color:#555}
/* duel */
.card.duel{border:2px solid var(--red);background:linear-gradient(180deg,#fff2ea,#f6dccd)}
.duel h2{color:#8c2e20;border-color:#e2a48f}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0}
.fighter{background:#ffffff88;border-radius:10px;padding:8px;font-size:13px}
.fighter b{font-size:14px}
.vsx{font-family:Georgia,serif;font-size:26px;color:var(--red);font-weight:700}
.dlog{max-height:150px;overflow:auto;font-size:13px;background:#fff8;border-radius:8px;padding:6px 8px;margin-top:8px}
.dlog div{padding:2px 0;border-bottom:1px dotted #e0bfae}
.dlog .foe{color:#8c2e20}.dlog .me{color:#244f8a}.dlog .sys{color:#555;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.queued{font-size:12px;color:#244f8a;margin-top:4px;min-height:16px}
/* world event */
.card.wevent{border:2px solid #1d8a7e;background:linear-gradient(180deg,#e9fbf7,#cdeee6)}
.wevent h2{color:#0f5d55;border-color:#86cfc3}
.evlist{font-size:13px;max-height:190px;overflow:auto;margin-top:8px}
.evlist .r{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:3px 0;border-bottom:1px dotted #9fd3c9}
.evlist .r.me{font-weight:700;color:#0f5d55}
.vote.on{outline:3px solid #0f5d55}
/* tabs */
.tabs{display:flex;gap:4px;margin:-4px 0 10px}
.tabs button{flex:1;padding:7px 4px;border:1px solid #c8ad74;background:#efe0bd;border-radius:9px;color:#5a3b12;font-weight:600}
.tabs button.on{background:#5a3b12;color:#f6ecd4}
.branch{margin-bottom:10px;border-radius:10px;padding:8px;background:#ffffff66;border:1px solid #dcc79a}
.branch h3{font-size:14px;margin-bottom:6px}
.branch.light h3{color:#9a7400}.branch.wrath h3{color:#a3311f}.branch.nature h3{color:#3b7a2c}
.skill{display:grid;grid-template-columns:32px 1fr auto;gap:6px 8px;align-items:center;padding:6px 0;border-top:1px dotted #d6bf8e}
.skill:first-of-type{border-top:0}
.skill .ic{font-size:22px;text-align:center}
.skill .nm{font-weight:700;font-size:14px}.skill .ds{font-size:11.5px;color:var(--ink2);line-height:1.3}
.skill.locked{opacity:.55}
.skill .sb{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.pips{color:var(--gold);letter-spacing:1px;font-size:12px}
.align{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#a3311f,#cfcfcf 50%,#e8c063);margin:6px 0 2px}
.align i{position:absolute;top:-4px;width:6px;height:20px;background:#2a1d08;border-radius:3px;transform:translateX(-50%);transition:left .4s}
.alignLbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)}
.box{background:#ffffff66;border:1px solid #dcc79a;border-radius:10px;padding:9px;margin-bottom:10px;font-size:13.5px}
.box h3{font-size:15px;color:#5a3b12;margin-bottom:4px}
.big{font-size:22px;font-weight:700;font-family:Georgia,serif;color:#5a3b12}
.rival{display:grid;grid-template-columns:1fr auto;gap:4px;padding:7px 0;border-bottom:1px dotted #d6bf8e;font-size:13px}
/* modal & toasts */
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
#modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
#modal input{width:100%;padding:9px;border-radius:9px;border:1px solid #c8ad74;margin:4px 0 10px;font:inherit;background:#fffaf0}
#toasts{position:fixed;right:14px;bottom:14px;z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toast{background:#2a1f45;color:#f3e6c4;border:1px solid var(--gold);padding:9px 12px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;animation:fadeIn .3s}
.deadbox{background:#3a2a2a;color:#f6d6d0;border-radius:10px;padding:10px;margin:8px 0;font-size:13.5px}
/* v3: предметы, лист героя, черты, подземелье */
#colCenter>div:empty{display:none}
#updBar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:45;display:none;gap:10px;align-items:center;background:#2a1f45;color:#f3e6c4;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:14px;max-width:calc(100vw - 20px)}
#updBar.on{display:flex}
#modal textarea{width:100%;min-height:110px;font:12px/1.35 monospace;border-radius:9px;border:1px solid #c8ad74;background:#fffaf0;padding:8px;margin:4px 0}
.pwaNote{font-size:12.5px;color:var(--ink2);margin-top:6px}
.r0{color:#555}.r1{color:#2e8b3a}.r2{color:#2a64c4}.r3{color:#8a3cc4}.r4{color:#d9731a}
.r2,.r3,.r4{font-weight:700}
.cursed{color:#b8412f!important}
.eq{list-style:none;padding:0;margin:4px 0 0;font-size:13px}
.eq li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px;align-items:center;padding:3px 0;border-bottom:1px dotted #d6bf8e}
.eq li .eqb{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.gsc{font-weight:600;color:#5a3d14}
.gv.g{color:#2e6b2a;font-weight:600}.gv.n{color:#6b5a2a;font-weight:600}.gv.w{color:#a2611c;font-weight:600}.gv.b{color:#8c2e20;font-weight:700}
.opts.tiers .btn.tier{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%}
.dgs{flex-wrap:wrap;gap:4px 10px;font-size:.92em}
.eq li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:6px 0}
.stgrid div{background:#ffffff88;border:1px solid #dcc79a;border-radius:8px;text-align:center;padding:4px 0;font-size:11px;line-height:1.2}
.stgrid b{display:block;font-size:15px;color:#5a3b12}
.stgrid .pr{border-color:var(--gold);background:#fff6d8}
.sheet h3{font-size:15px;margin:10px 0 4px;color:#5a3b12}
.doll{display:grid;grid-template-columns:minmax(0,1fr) minmax(84px,1.05fr) minmax(0,1fr);gap:6px;margin:4px 0 6px}
.dcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.slotc{display:grid;grid-template-columns:24px minmax(0,1fr);grid-template-rows:auto auto;align-items:center;column-gap:4px;min-height:50px;padding:4px 5px;border:2px solid #b89a63;border-radius:8px;background:#fffaf0;font:inherit;font-size:11px;line-height:1.15;text-align:left;cursor:pointer;color:#3a2a10;min-width:0}
.slotc .ci{grid-row:1/3;font-size:19px;text-align:center}
.slotc .cn{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word;hyphens:auto}
@media (max-width:400px){.doll{gap:4px;grid-template-columns:minmax(0,1fr) minmax(76px,.9fr) minmax(0,1fr)}.slotc{grid-template-columns:auto minmax(0,1fr);padding:3px 4px;min-height:48px;font-size:10.5px}.slotc .ci{grid-row:1;grid-column:1;font-size:16px;text-align:left}.slotc .cb{grid-row:1;grid-column:2;justify-content:flex-end}.slotc .cn{grid-row:2;grid-column:1/3}.dav{font-size:32px}}
.slotc .cb{display:flex;gap:3px;font-style:normal}.slotc .cb i{font-style:normal;font-size:10px;font-weight:700;color:#5a3b12}.slotc .cb i.cur{color:#8c2e20}
.bldc{font-weight:600;color:#5a3b12}.bldc .re{color:#2a64c4}.bldbox{border:1px solid #d6bf8e;border-radius:8px;padding:6px 8px;background:#fbf4e3;font-size:13px}.bldp,.bldre,.bldh{margin:3px 0}.bldre{color:#2a64c4}.bldopt{text-align:left;display:block;width:100%}.bldopt .small{font-weight:400}.feat .pref{background:#eef3e0;border-radius:6px;padding:4px 8px;margin:4px 0;font-size:13px}
.dwarn{background:#fbe1d8;border:1px solid #d98c6c;color:#7a2a12;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:600;margin:4px 0}
.dlast{font-size:12px;margin:4px 0;background:#fbf4e3;border-radius:6px;padding:3px 6px}.dlast summary{cursor:pointer;font-weight:600}.dlast div{padding:1px 0;border-bottom:1px dotted #e0cfa8}
.slotc.empty{border-style:dashed;border-color:#cdb88d;background:transparent;color:#9c8762;cursor:default}.slotc.empty .ci{opacity:.5}
.slotc.r2,.slotc.r3,.slotc.r4{box-shadow:0 0 0 1px rgba(0,0,0,.05),0 0 6px -1px currentColor}
.slotc:not(.empty):hover{background:#fff3d6}
.dmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border:1px solid #d6bf8e;border-radius:10px;background:linear-gradient(#fbf1dc,#f2e2bf);text-align:center;font-size:11px;min-width:0}
.dav{font-size:40px;line-height:1}.dgsv{font-size:13px}.dst{color:#5a4a2a}
.dza{display:flex;flex-direction:column;gap:1px;width:100%;font-size:10.5px;color:#6b5a3a}.dza span{display:flex;justify-content:space-between;padding:0 2px}

:root,body[data-theme=good]{--gold:#c9962b;--gold2:#f0c75e;--hdr1:#221a3e;--hdr2:#2a1f48;--bgA:#4a3670;--bg2:#2a1f45;--bg1:#14122b;--parch:#fbf1d8;--parch2:#f1e1ba;--cardb:#e0c68e;--btn1:#f0cb6e;--btn2:#cf9a2c;--btnb:#a77b20;--btnInk:#2b1d07;--navbg:#1c1638f5;--navInk:#cdb98b;--h2c:#5a3b12;--glow:#f0c75e}

body[data-theme=neutral]{--gold:#6f93b8;--gold2:#a9cbec;--hdr1:#121a28;--hdr2:#19263b;--bgA:#2b3f5c;--bg2:#17233a;--bg1:#0b111c;--parch:#eef1f4;--parch2:#dde4ea;--cardb:#b4c3d1;--btn1:#cddcec;--btn2:#93b0cf;--btnb:#6f8fb0;--btnInk:#17263a;--navbg:#101826f5;--navInk:#9fb3c8;--h2c:#2c3e55;--glow:#a9cbec}

.rbonus{background:#fff6dc;border:1px solid #e0c68e;border-radius:10px;padding:8px;margin:6px 0;font-size:14px}.rbonus.on{background:#e7f6dc;border-color:#9fd08a}
.rseg{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#e8e0cc;margin:8px 0;border:1px solid #c8b78f}.rseg i{display:block;height:100%}.rseg .un{background:#e8e0cc}
.rgods{list-style:none;padding:0;margin:0 0 6px}.rgods li{display:flex;align-items:center;gap:4px;padding:3px 0;font-size:13.5px;border-bottom:1px dotted #e3d6b3}.rgods li span{margin-left:auto;color:#6b5a3a}.rgods li.me{font-weight:700}.rgods li.un{color:#7a6a4a}

/* ---------- v13: бумажная кукла героя ---------- */
.visav{width:auto;height:auto;border-radius:12px;padding:0;overflow:visible;background:transparent;border:none;display:flex;align-items:flex-end;justify-content:center}
.hc-av.visav{width:72px;height:96px;flex:none}
.dav.visav{width:100%;height:120px;margin:0 auto}
.vwrap{display:inline-flex;align-items:flex-end;justify-content:center;line-height:0;position:relative}
.vwrap.vtap{cursor:pointer;border-radius:10px;min-width:44px;min-height:44px}
.vwrap.vtap:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.vwrap.vtap:hover .vis{filter:brightness(1.05)}
.vis{width:72px;height:100px;display:block;overflow:visible}
.vis.sm{width:36px;height:50px}
.vis.lg{width:100px;height:140px}
.vis.foe{opacity:.95}
.route .rdot.hasvis{top:-28px;font-size:0}
.route .rdot.hasvis .vis{width:40px;height:56px;filter:drop-shadow(0 2px 2px #0006)}
.vfight{display:flex;justify-content:center;margin:6px 0 4px}
.vpair{display:flex;align-items:flex-end;gap:10px;justify-content:center}
.vpair .vvs{font-size:22px;align-self:center;opacity:.7}
.vpair .vis{width:88px;height:122px}
.vaura{pointer-events:none}
/* позы — короткие CSS-анимации; reduced-motion глушит глобально */
.vis .armR,.vis .armL,.vis .vl.weapon,.vis .vl.offhand,.vis .vroot{transform-box:fill-box;transform-origin:center}
.vis.p-walk .vroot{animation:vwalk 0.7s ease-in-out infinite}
.vis.p-walk .armR{animation:vswingR 0.7s ease-in-out infinite}
.vis.p-walk .armL{animation:vswingL 0.7s ease-in-out infinite}
.vis.p-walk .vl.legs path:nth-child(1){animation:vlegL 0.7s ease-in-out infinite}
.vis.p-walk .vl.legs path:nth-child(2){animation:vlegR 0.7s ease-in-out infinite}
@keyframes vwalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes vswingR{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-12deg)}}
@keyframes vswingL{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes vlegL{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes vlegR{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-8deg)}}
.vis.p-attack .vl.weapon,.vis.p-attack .armR{animation:vatk .4s ease-out 1}
.vis.p-attack .vroot{animation:vlean .4s ease-out 1}
@keyframes vatk{0%{transform:rotate(0)}40%{transform:rotate(-40deg) translate(4px,-2px)}100%{transform:rotate(0)}}
@keyframes vlean{0%,100%{transform:translateX(0)}40%{transform:translateX(4px)}}
.vis.p-block .vl.offhand,.vis.p-block .armL{animation:vblk .35s ease-out 1;transform:rotate(-18deg) translate(2px,-4px)}
.vis.p-block .vroot{transform:translateX(-2px)}
@keyframes vblk{0%{transform:rotate(0)}100%{transform:rotate(-18deg) translate(2px,-4px)}}
.vis.p-hurt .vroot{animation:vhurt .45s ease-out 1}
.vis.p-hurt{filter:brightness(1.15) saturate(1.2)}
@keyframes vhurt{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px) rotate(-4deg)}60%{transform:translateX(3px)}}
.vis.p-dead .vroot{transform:rotate(70deg) translate(10px,20px);opacity:.55;transform-origin:60px 120px}
.vis.p-idle .armR{transform:rotate(4deg)}.vis.p-idle .armL{transform:rotate(-4deg)}
.vis.cursed .vroot{filter:brightness(.78) saturate(.65)}
.vis.leg .vaura{opacity:.2;animation:vpulse 2.2s ease-in-out infinite}
.vis.epi .vaura{opacity:.14}
@keyframes vpulse{0%,100%{opacity:.12}50%{opacity:.22}}
body.rm .vis.p-walk .vroot,body.rm .vis.p-walk .armR,body.rm .vis.p-walk .armL,body.rm .vis.p-walk .vl.legs path,
body.rm .vis.p-attack .vl.weapon,body.rm .vis.p-attack .armR,body.rm .vis.p-attack .vroot,
body.rm .vis.p-block .vl.offhand,body.rm .vis.p-hurt .vroot,body.rm .vis.leg .vaura{animation:none!important}
body.rm .vis.p-walk .armR{transform:rotate(10deg)}body.rm .vis.p-walk .armL{transform:rotate(-10deg)}
body.rm .vis.p-attack .armR,body.rm .vis.p-attack .vl.weapon{transform:rotate(-28deg)}
body.rm .vis.p-block .armL,body.rm .vis.p-block .vl.offhand{transform:rotate(-18deg) translate(2px,-4px)}
body.rm .vis.p-hurt .vroot{transform:translateX(-3px)}
body.theme-good .visav,body.theme-good .vfight{--vis-glow:color-mix(in srgb,var(--gold2) 35%,transparent)}
body.theme-evil .vpair .vis.foe{filter:hue-rotate(-10deg) saturate(1.15)}
@media (max-width:400px){
  .hc-av.visav{width:58px;height:80px}.vis{width:58px;height:80px}
  .vpair .vis{width:70px;height:98px}.dav.visav{height:100px}.vis.lg{width:84px;height:118px}
}
@media (min-width:1000px){
  .hc-av.visav{width:84px;height:112px}.hc-av.visav .vis{width:84px;height:112px}
  .vpair .vis{width:100px;height:138px}
}

/* ---------- v14: живая сцена местности ---------- */
.hc-scene{margin:6px 0 4px;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 0 0 1px #0001}
.scn{position:relative;height:clamp(150px,42vw,220px);max-height:48vh;cursor:pointer;isolation:isolate;background:#2a3040;color:#87b0d8}
.scn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.scn-bg{position:absolute;inset:0;overflow:hidden}
.scn-layer{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.scn-sky{z-index:0}.scn-far{z-index:1}.scn-mid{z-index:2}.scn-ground{z-index:3}
.scn-parallax{transform:translateX(0)}
.scn-tile{/* ground strip is 640-wide in a 320 view — offset for scroll */}
.scn-stage{position:absolute;left:0;right:0;bottom:4px;z-index:5;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;height:78%}
.scn-stage .vwrap,.scn-stage .vis{pointer-events:none}
.scn-stage .vis{width:min(88px,28%);height:auto;max-height:95%;filter:drop-shadow(0 3px 2px #0005)}
.scn-label{position:absolute;left:8px;top:8px;z-index:6;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--card,#fff) 82%,transparent);color:var(--ink);border:1px solid var(--line);backdrop-filter:blur(4px);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.scn-ic{margin-right:2px}
/* time of day sky colors */
.scn-day{color:#7eb6e8}.scn-day .scn-skyfill{color:#7eb6e8}
.scn-dusk{color:#c87850}.scn-dusk .scn-skyfill{color:#c87850}
.scn-night{color:#1a2438}.scn-night .scn-skyfill{color:#1a2438}.scn-night .scn-moongap{color:#1a2438}
/* biome accents */
.scn-forest{--scn-g:#2e5a34}.scn-swamp{--scn-g:#243828;color:#4a6858}.scn-swamp.scn-day{color:#5a7868}
.scn-mount{--scn-g:#5a6070}.scn-coast{--scn-g:#c8b078;color:#6aa0c0}
.scn-city,.scn-village,.scn-castle{--scn-g:#5a5048}.scn-field,.scn-valley{--scn-g:#5a8a38}
.scn-waste{--scn-g:#7a6858;color:#a09070}.scn-ravine{--scn-g:#3a3848;color:#4a5068}
.scn-dungeon{color:#1a1428;--scn-g:#1a1424}.scn-arena{--scn-g:#8a6a48;color:#c09060}
.scn-camp{--scn-g:#3a4a30}
/* walk parallax — CSS only */
.scn-walk .scn-far .scn-parallax{animation:scnParFar 12s linear infinite}
.scn-walk .scn-mid .scn-parallax{animation:scnParMid 7s linear infinite}
.scn-walk .scn-ground .scn-parallax{animation:scnParGnd 3.5s linear infinite}
@keyframes scnParFar{from{transform:translateX(0)}to{transform:translateX(-10%)}}
@keyframes scnParMid{from{transform:translateX(0)}to{transform:translateX(-18%)}}
@keyframes scnParGnd{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.scn-walk .scn-clouds{animation:scnCloud 20s linear infinite}
@keyframes scnCloud{from{transform:translateX(0)}to{transform:translateX(-30%)}}
.scn-bub{animation:scnBub 2.4s ease-in-out infinite}
@keyframes scnBub{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.9;transform:translateY(-4px)}}
.scn-wave{animation:scnWave 3s ease-in-out infinite}
.scn-wave2{animation:scnWave 4s ease-in-out infinite reverse}
@keyframes scnWave{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.scn-fire{animation:scnFire .6s ease-in-out infinite alternate}
@keyframes scnFire{from{opacity:.7;transform:scale(1)}to{opacity:1;transform:scale(1.15)}}
.scn-torch{animation:scnTorch 1.8s ease-in-out infinite}
@keyframes scnTorch{0%,100%{opacity:.15}50%{opacity:.35}}
/* fight mini scene */
.scn-fight.scn-mini{width:100%;height:140px;max-height:28vh;cursor:default;border-radius:12px;margin-bottom:4px;border:1px solid var(--line);overflow:hidden}
.vfight{width:100%}
.vfight .scn{width:100%}
.scn-stage-fight{height:100%;align-items:flex-end;padding-bottom:2px}
.scn-stage-fight .vpair{width:100%;justify-content:space-evenly}
.scn-stage-fight .vis{width:72px;max-height:90%}
.vfight .scn-label{display:none}
/* collapse */
body.heroCol .hc-scene .scn{height:88px;max-height:18vh}
body.heroCol .hc-scene .scn-label{font-size:11px;padding:2px 8px}
body.heroCol .hc-scene .scn-stage .vis{width:48px}
/* reduced motion */
body.rm .scn-walk .scn-parallax,body.rm .scn-walk .scn-clouds,
body.rm .scn-bub,body.rm .scn-wave,body.rm .scn-wave2,body.rm .scn-fire,body.rm .scn-torch{animation:none!important}
@media (prefers-reduced-motion:reduce){
  .scn-walk .scn-parallax,.scn-walk .scn-clouds,.scn-bub,.scn-wave,.scn-wave2,.scn-fire,.scn-torch{animation:none!important}
}
@media (max-width:400px){
  .scn{height:clamp(140px,46vw,180px)}
  .scn-stage .vis{width:72px}
  .scn-fight.scn-mini{height:120px}
}
@media (min-width:1000px){
  .scn{height:240px;max-height:280px}
  .scn-stage .vis{width:100px}
  .scn-fight.scn-mini{height:160px}
}
/* theme accents on scene frame */
body.theme-good .hc-scene{border-color:color-mix(in srgb,var(--gold2) 45%,var(--line))}
body.theme-evil .hc-scene{border-color:color-mix(in srgb,#8a2030 40%,var(--line))}
body.theme-evil .scn-night{color:#1a1020}

/* ---------- v15: нарисованные пластины + кукла ---------- */
.scn-plate{position:absolute;inset:0;z-index:4;overflow:hidden;pointer-events:none}
.scn-plate.fail{display:none}
.scn-plate-shift{position:absolute;inset:0;width:112%;left:-6%}
.scn-plate-img{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block;user-select:none;-webkit-user-drag:none}
.scn-svg-fallback{position:absolute;inset:0;z-index:1}
.scn.has-art .scn-svg-fallback{opacity:0;visibility:hidden}
.scn-tod-veil,.scn-theme-veil{position:absolute;inset:0;pointer-events:none;z-index:2}
.scn-day .scn-tod-veil{background:linear-gradient(180deg,#fff2 0%,transparent 35%,#0001 100%)}
.scn-dusk .scn-tod-veil{background:linear-gradient(180deg,#e8785044 0%,#c0603022 40%,#3a204088 100%)}
.scn-night .scn-tod-veil{background:linear-gradient(180deg,#1a2848aa 0%,#1a203888 45%,#0a1020cc 100%)}
body.theme-good .scn-theme-veil{background:radial-gradient(ellipse at 50% 80%,#f5c54218,transparent 60%)}
body.theme-evil .scn-theme-veil{background:radial-gradient(ellipse at 50% 20%,#8a203028,transparent 55%),linear-gradient(180deg,#40081814,transparent 50%)}
body.theme-neutral .scn-theme-veil{background:transparent}
.scn-walk .scn-plate-shift{animation:scnPlateWalk 14s linear infinite}
@keyframes scnPlateWalk{from{transform:translateX(0)}to{transform:translateX(-8%)}}
/* пыль под ногами */
.scn-dust{position:absolute;left:50%;bottom:10%;width:80px;height:24px;margin-left:-40px;z-index:4.5;pointer-events:none}
.scn-dust i{position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:#c8b090aa;opacity:0;animation:scnDust 1.1s ease-out infinite}
.scn-dust i:nth-child(1){left:20%;animation-delay:0s}.scn-dust i:nth-child(2){left:35%;animation-delay:.18s}
.scn-dust i:nth-child(3){left:50%;animation-delay:.35s}.scn-dust i:nth-child(4){left:62%;animation-delay:.5s}
.scn-dust i:nth-child(5){left:28%;animation-delay:.7s}.scn-dust i:nth-child(6){left:55%;animation-delay:.9s}
@keyframes scnDust{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:.7}100%{opacity:0;transform:translate(-10px,-14px) scale(1.2)}}
body.rm .scn-walk .scn-plate-shift,body.rm .scn-dust i{animation:none!important}
@media (prefers-reduced-motion:reduce){.scn-walk .scn-plate-shift,.scn-dust i{animation:none!important}}
/* кукла: объёмнее */
.vis .vroot{filter:drop-shadow(0 2px 1px #0004)}
.scn-stage .vis{filter:drop-shadow(0 4px 3px #0006) drop-shadow(0 1px 0 #fff2)}
.scn.has-art .scn-stage .vis{width:min(96px,30%)}
.scn-fight.has-art .scn-stage-fight .vis{width:78px}




/* ---------- v16–17: стильный герой + worn-kit (одето) + бой + путешествие ---------- */
.vwrap.painted{position:relative;display:inline-flex;align-items:flex-end;justify-content:center;width:72px;height:100px}
.vwrap.painted.sm,.vwrap.painted .vis.sm{width:36px;height:50px}
.vwrap.painted .vis.lg,.dav .vwrap.painted{width:100px;height:140px}
.vpaint{position:absolute;inset:0;z-index:1;pointer-events:none}
.vpaint .vp-fr{position:absolute;inset:0;opacity:0;transition:opacity .12s linear}
.vpaint .vp-kit{position:absolute;inset:0;pointer-events:none}
.vpaint .vp-fr img{width:100%;height:100%;object-fit:contain;object-position:bottom center;display:block;opacity:1;filter:drop-shadow(0 3px 2px #0005)}
.vwrap.painted .vgear{position:absolute;inset:0;z-index:2;width:100%!important;height:100%!important;pointer-events:none;overflow:visible}
.vwrap.painted .vfb{display:none}
.vwrap.painted.paint-fail .vpaint{display:none}
.vwrap.painted.paint-fail .vgear{display:none}
.vwrap.painted.paint-fail .vfb{display:block;position:relative;inset:auto;opacity:1}
.vfoe .foe-svg{display:none}
.vfoe.paint-fail .fpaint{display:none}
.vfoe.paint-fail .foe-svg{display:block;position:relative;opacity:1}
/* --- bare (нет надетого силуэта) --- */
.vwrap:not([data-kit]),.vwrap[data-kit=""]{ /* bare path */ }
.vwrap[data-pose=idle]:not([data-kit]):not([data-kit=h]):not([data-kit=l]):not([data-kit=c]) .vp-bare.vp-idle,
.vwrap[data-pose=rest]:not([data-kit]):not([data-kit=h]):not([data-kit=l]):not([data-kit=c]) .vp-bare.vp-idle,
.vwrap[data-kit=""][data-pose=idle] .vp-bare.vp-idle,
.vwrap[data-kit=""][data-pose=rest] .vp-bare.vp-idle{opacity:1}
.vwrap[data-kit=""][data-pose=walk] .vp-bare.vp-walk1,
.vwrap:not([data-kit])[data-pose=walk] .vp-bare.vp-walk1{opacity:1;animation:vpWalkA .55s steps(1) infinite}
.vwrap[data-kit=""][data-pose=walk] .vp-bare.vp-walk2,
.vwrap:not([data-kit])[data-pose=walk] .vp-bare.vp-walk2{opacity:0;animation:vpWalkB .55s steps(1) infinite}
.vwrap[data-kit=""][data-pose=attack] .vp-bare.vp-attack,
.vwrap:not([data-kit])[data-pose=attack] .vp-bare.vp-attack{opacity:1}
.vwrap[data-kit=""][data-pose=block] .vp-bare.vp-block,
.vwrap:not([data-kit])[data-pose=block] .vp-bare.vp-block{opacity:1}
.vwrap[data-kit=""][data-pose=hurt] .vp-bare.vp-hurt,
.vwrap:not([data-kit])[data-pose=hurt] .vp-bare.vp-hurt{opacity:1}
/* dead always bare (упал) */
.vwrap[data-pose=dead] .vp-bare.vp-dead{opacity:1}
.vwrap[data-pose=dead] .vp-worn{opacity:0!important;animation:none!important}
@keyframes vpWalkA{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes vpWalkB{0%,49.9%{opacity:0}50%,100%{opacity:1}}
/* --- worn kits: hide bare, show pose-matched kit plate --- */
.vwrap[data-kit=h]:not([data-pose=dead]) .vp-bare,
.vwrap[data-kit=l]:not([data-pose=dead]) .vp-bare,
.vwrap[data-kit=c]:not([data-pose=dead]) .vp-bare{opacity:0!important;animation:none!important}
.vwrap[data-kit=h][data-pose=idle] .vp-kit-h .vp-idle,
.vwrap[data-kit=h][data-pose=rest] .vp-kit-h .vp-idle{opacity:1}
.vwrap[data-kit=h][data-pose=walk] .vp-kit-h .vp-walk1{opacity:1;animation:vpWalkA .55s steps(1) infinite}
.vwrap[data-kit=h][data-pose=walk] .vp-kit-h .vp-walk2{opacity:0;animation:vpWalkB .55s steps(1) infinite}
.vwrap[data-kit=h][data-pose=attack] .vp-kit-h .vp-attack{opacity:1}
.vwrap[data-kit=h][data-pose=block] .vp-kit-h .vp-block{opacity:1}
.vwrap[data-kit=h][data-pose=hurt] .vp-kit-h .vp-hurt{opacity:1}
/* leather: unique idle; other poses = plate kit + brown filter */
.vwrap[data-kit=l][data-pose=idle] .vp-kit-l .vp-idle,
.vwrap[data-kit=l][data-pose=rest] .vp-kit-l .vp-idle{opacity:1}
.vwrap[data-kit=l][data-pose=walk] .vp-kit-h .vp-walk1{opacity:1;animation:vpWalkA .55s steps(1) infinite;filter:sepia(.45) hue-rotate(-18deg) saturate(1.15) brightness(.96)}
.vwrap[data-kit=l][data-pose=walk] .vp-kit-h .vp-walk2{opacity:0;animation:vpWalkB .55s steps(1) infinite;filter:sepia(.45) hue-rotate(-18deg) saturate(1.15) brightness(.96)}
.vwrap[data-kit=l][data-pose=attack] .vp-kit-h .vp-attack{opacity:1;filter:sepia(.45) hue-rotate(-18deg) saturate(1.15) brightness(.96)}
.vwrap[data-kit=l][data-pose=block] .vp-kit-h .vp-block{opacity:1;filter:sepia(.45) hue-rotate(-18deg) saturate(1.15) brightness(.96)}
.vwrap[data-kit=l][data-pose=hurt] .vp-kit-h .vp-hurt{opacity:1;filter:sepia(.45) hue-rotate(-18deg) saturate(1.15) brightness(.96)}
/* cloth/mage: unique idle; motion = plate + purple filter */

function voice(text) {

  if (S.fight) return toast('Идёт бой — командуйте зонами и силами бога.');

  if (R() > obeyChance()) { diary(`Услышал что-то вроде «${text}», но сделал вид, что это ветер.`, 'god'); return; }
  const v = VOICE.find(x => x.re.test(text));
  if (!v) { diary(pick([`Услышал глас: «${text}». Долго думал. Решил, что это рецепт борща.`, `С небес донеслось «${text}». Записал в дневник. Перечитал. Ничего не понял.`, `Бог сказал: «${text}». Кивнул с умным видом.`]), 'god', '+1 доверия'); addTrust(1); return; }

/* ---------- Развилки и божественные моменты ----------
   Один таймер (PACE.fork): чаще всего «божественный момент» (part3h.js), иногда старая «молитва» (FORKS).
   startFork(число) — молитва по номеру, startFork('id') — момент по id, без аргумента — случайно. */
function startFork(idx) {
  if (S.fork || forkPaused() || S.hero.state === 'dead') return false;
  if (typeof idx === 'string') return startMoment(idx);
  if (idx === undefined && R() >= MOM_LEGACY_P) { const ok = startMoment(); if (ok) return true; }
  let i = idx;
  if (i === undefined) { const free = FORKS.map((_, k) => k).filter(k => !S.forkHist.includes(k)); i = pick(free.length ? free : FORKS.map((_, k) => k)); }
  S.forkHist.push(i); if (S.forkHist.length > 10) S.forkHist.shift();
  S.fork = { i, t: MOM_T, T: MOM_T, cls: R() < .4 };
  S.stats.forks++;
  diary('🙏 Молюсь: ' + FORKS[i].t, 'fork');
  if (!SILENT) toast('🙏 Герой молится и ждёт вашего решения!');
  return true;
}
/* Варианты молитвы: свои + (иногда) классовый + всегда «Ничего не делать» (герой поступит по-своему) */
function forkOptions(fk) { const f = FORKS[fk.i], o = f.o.slice(); if (fk.cls) { const c = CLASS_FORK[S.hero.cls]; o.push({ l: c.l, a: 0, clsOpt: true }); } o.push({ l: NOTHING, a: 0, nothing: true }); return o; }
function resolveOption(fi, k) {
  const f = FORKS[fi];
  if (k >= f.o.length) { // классовый вариант
    const c = CLASS_FORK[S.hero.cls], chk = check(c.s, 13);
    const e = chk.ok ? { xp: 18, gold: 25, fol: S.hero.cls === 'cleric' || S.hero.cls === 'bard' ? 2 : 0 } : { hp: -15, xp: 6 };
    diary(`${CLASSES[S.hero.cls].ab}! ${chk.ok ? c.ok : c.no}`, 'fork', [chk.label, applyFx(e)].filter(Boolean).join(' · '));
    return;
  }
  const opt = f.o[k], st = (FORK_STATS[fi] || [])[k];
  let res = opt.r[opt.r.length - 1], label = '';
  if (opt.r.length > 1 && st) {
    const p = opt.r[0].p || .5, chk = check(st, clamp(Math.round(23 - p * 20), 5, 22));
    res = chk.ok ? opt.r[0] : opt.r[opt.r.length - 1]; label = chk.label;
  } else if (opt.r.length > 1) {
    const bonus = (S.buffs.luck > 0 ? .2 : 0) + (S.hero.trust > 80 ? .05 : 0);
    for (const r of opt.r) { if (r.p === undefined) { res = r; break; } if (R() < r.p + bonus) { res = r; break; } }
  }
  const fx = applyFx(res.e);
  diary(res.t, 'fork', [label, fx || 'без последствий'].filter(Boolean).join(' · '));
}
function answerFork(k) {
  if (!S.fork) return;
  if (S.fork.m) return answerMoment(+k);
  const fk = S.fork, opts = forkOptions(fk); if (!opts[k]) return;
  const opt = opts[k];
  if (opt.nothing) { S.fork = null; S.stats.forksAns++; diary(`Бог сказал: «${NOTHING}». Ладно, поступлю по-своему.`, 'god'); diary(FORKS[fk.i].self.t, 'fork', applyFx(FORKS[fk.i].self.e) || 'без последствий'); return; }
  S.fork = null; S.stats.forksAns++; S.timers.fork = Math.max(S.timers.fork, 120);
  shiftAlign(opt.a); addGxp(10);
  const real = opts.filter(o => !o.nothing);
  if (R() < obeyChance()) { addTrust(2); diary(`Услышал волю бога: «${opt.l}». Так и сделаю!`, 'god', '+2 доверия'); resolveOption(fk.i, k); }
  else {
    const others = real.map((_, j) => j).filter(j => j !== k); const j = pick(others);
    diary(`Бог сказал «${opt.l}», но я решил, что лучше знаю. Выбираю «${real[j].l}».`, 'god');
    resolveOption(fk.i, j);
  }
}
function timeoutFork(offline) {
  if (!S.fork) return;
  if (S.fork.m) return timeoutMoment();
  const fk = S.fork, f = FORKS[fk.i]; S.fork = null;
  const pen = !offline && godPresent() ? '−1 доверия' : ''; // обижается, только если бог был рядом и промолчал
  if (pen) addTrust(-1);
  if (R() < .7) diary(f.self.t, 'fork', [applyFx(f.self.e), pen].filter(Boolean).join(', '));
  else { const opts = forkOptions(fk).filter(o => !o.nothing), j = rnd(0, opts.length - 1); diary(`Бог промолчал. Выбрал наугад: «${opts[j].l}».`, 'fork', pen); resolveOption(fk.i, j); }
  if (SILENT) SILENT.c.forks++;
}

/* ---------- Паства и храм ---------- */
const TEMPLE_NAMES = ['часовня-сарай', 'деревянный храм', 'каменный храм', 'храм с колокольней', 'собор', 'великий собор', 'храм-небоскрёб', 'небесный дворец', 'храм с фонтаном из лимонада', 'Обитель Всего'];
function templeGive(n) {
  if (S.flock.temple >= 10) return toast('Храм уже величайший в мире.');
  n = n === 'all' ? Math.floor(S.god.faith) : Math.min(+n, Math.floor(S.god.faith));
  if (n < 1) return toast('Не хватает веры.');
  S.god.faith -= n; S.flock.templeProg += n; addGxp(n / 4);
  while (S.flock.temple < 10 && S.flock.templeProg >= templeCost()) {
    S.flock.templeProg -= templeCost(); S.flock.temple++;
    diary(`⛪ Паства отстроила ${TEMPLE_NAMES[S.flock.temple - 1]} во славу нашего бога! Кадило пахнет величием.`, 'level');
  }
  if (S.flock.temple >= 10) S.flock.templeProg = 0;
}
function miracle(id) {
  const m = MIRACLES.find(x => x.id === id); if (!m) return; if (S.god.faith < m.cost) return toast('Не хватает веры.');
  S.god.faith -= m.cost; const n = rnd(m.fol[0], m.fol[1]); S.flock.fol += n; addTrust(m.trust); addGxp(m.cost / 3); shiftAlign(1);
  diary('🌈 ' + m.t, 'event', `+${n} паствы, +${m.trust} доверия`);
}
function recruit(n) {
  const c = soldierCost();
  n = Math.min(n, Math.floor(S.god.faith / c), Math.floor(S.flock.fol / 2));
  if (n < 1) return toast('Нужно ' + c + ' веры и 2 последователя на одного солдата.');
  S.god.faith -= c * n; S.flock.fol -= 2 * n; S.flock.army += n; shiftAlign(-1 * Math.ceil(n / 3)); addGxp(n * 3);
  diary(`⚔ ${n * 2} ${plural(n * 2, 'последователь сменил', 'последователя сменили', 'последователей сменили')} молитвенники на вилы. В божьей армии +${n}.`, 'god');
}

/* =====================================================================
   5б) БОЖЕСТВЕННЫЕ МОМЕНТЫ — расширение развилок (v10)
   Короткий выбор раз в 5–10 мин (×1): ситуация в 1–2 фразы, 2–3 кнопки, одна всегда «Ничего не делать».
   Используют ту же машинку, что и развилки: S.fork (поле m — id момента), PACE.fork, startFork/answerFork/timeoutFork.
   Формат варианта:
     { l: 'Подпись', cost: вера, a: сдвиг характера, s: 'str' | ['str','dex'] (лучшая), dc, ok: [текст, эффекты], no: [текст, эффекты] }
     { l, r: [текст, эффекты] }  — без проверки;   { l, run: v => mo(текст, эффекты, проверка) } — особый
     need: v => bool — когда вариант доступен (иначе кнопка серая).  n: исход «Ничего не делать» (так же).
   Эффекты — как у развилок (applyFx): gold/xp/hp в «единицах» уровня, fol, trust, faith, potion, item, luck, quest, army
   + новые: shield (мин щита), tprog (вклад в храм), cure (вылечить травму). Урон моментов не убивает (оставляет ≥1 HP).
   ===================================================================== */
const MOM_T = 150;                 // секунд на ответ (при ×1; на ускорении — максимум ×2 быстрее, как у развилок)
const MOM_HIST = 20;               // столько последних моментов не повторяется
const MOM_LEGACY_P = .2;           // доля старых «молитв» (FORKS) среди выборов
const MOM_XP = 1.8;                // множитель опыта моментов (подогнан симуляцией: темп как у старых развилок)
const NOTHING = 'Ничего не делать';
const STAT_ABBR = { str: 'СИЛ', dex: 'ЛОВ', con: 'ТЕЛ', int: 'ИНТ', wis: 'МДР', cha: 'ХАР' };
let momClock = 0, momFightAt = -1e9, momFightN = '', momDunAt = -1e9, momDunOk = false;
const mo = (t, e, k) => ({ t, e: e || {}, k });
const bestOf = ss => (Array.isArray(ss) ? ss : [ss]).reduce((a, b) => statVal(b) > statVal(a) ? b : a);
/* Проверка с числами: «🎲 ЛОВ 13+4 = 17 против 14: успех». СЛ растёт на 1 каждые 4 уровня (как мастерство). */
function momCheck(s, dc) {
  const D = dc + Math.floor((S.hero.lvl - 1) / 4), k = check(s, D);
  k.lbl = `🎲 ${STAT_ABBR[s]} ${k.r}${fmtMod(k.b)} = ${k.r + k.b} против ${D}: ${k.ok ? 'успех' : 'провал'}${k.note}`;
  return k;
}
const gs = n => Math.round(n * goldScale(S.hero.lvl));     // сколько золота это «n» на уровне героя
/* v12: контекст региона для моментов «Войны за Олимп» */
function momRegCtx(h) {
  if (!S.oly || !REG_BY[h.reg]) return { reg: null };
  const X = S.oly.reg[h.reg], pop = REG_BY[h.reg].pop; let rg = null, rv = 0;
  for (const g in X.s) if (g !== 'me' && X.s[g] > rv) { rv = X.s[g]; rg = g; }
  if (rv < pop * .1) rg = null;
  return { reg: h.reg, mine: X.own === 'me', rg, rgOwn: !!(X.own && X.own !== 'me'), share: (X.s.me || 0) / pop };
}
function momCtx() {
  const h = S.hero, g = S.god, L = h.lvl;
  return {
    h, L, where: h.state === 'town' ? 'town' : 'road', race: h.race, cls: h.cls, bld: bldId(h),
    after: momClock - momFightAt < 180 ? momFightN : '', dun: momClock - momDunAt < 900, dunOk: momDunOk,
    low: h.hp < h.maxHp * .45, hurt: h.hp < h.maxHp * .8, rich: h.gold > gs(160), poor: h.gold < gs(15),
    temple: S.flock.temple, fol: S.flock.fol, faith: g.faith, align: g.align, trust: h.trust, potions: h.potions,
    night: (() => { const x = new Date().getHours(); return x >= 22 || x < 6; })(),
    ...momRegCtx(h)
  };
}

  <p><b>Герой живёт сам</b>: бродит, дерётся, торгует, отдыхает и пишет дневник. Ваша валюта — <b>вера</b>: копится от паствы и храма, а ещё герой жертвует золото, если доверяет вам. Это неспешная игра: до 10-го уровня — пара недель.</p>
  <p><b>📋 Характеристики.</b> СИЛ, ЛОВ, ТЕЛ, ИНТ, МДР, ХАР — как в настольных ролевых играх. Они влияют на бой, торговлю (Харизма), проповеди и исходы развилок: в дневнике видно «проверка Харизмы: успех». Раса и класс дают бонусы и особые умения.</p>
  <p><b>🎖 Черты.</b> На каждом чётном уровне герой выбирает черту или +2 к характеристике. Подскажите ему, иначе выберет сам.</p>
  <p><b>💎 Предметы</b> бывают обычные, необычные, редкие, эпические и легендарные. Иногда попадаются проклятые — их можно очистить за веру. Слотов 10: оружие, щит (или второй кинжал у плута; двуручное занимает обе руки), шлем, броня, пояс, перчатки, сапоги, амулет и два кольца. Шлем бережёт голову, пояс — пояс, сапоги — ноги, щит даёт шанс блока. У вещей есть требования («ур. 6, СИЛ 14»): пока не выполнены — вещь лежит в рюкзаке. 🧩 Комплекты (в основном из пещер) дают бонусы за 2, 4 и все части. Нажмите на вещь в «📋 Герой» — увидите подробности и сравнение. Герой и снаряжение видны на фигурке в живой нарисованной сцене местности (город, лес, болото, горы, берег, пещера…): в пути фон уезжает назад, в бою — тот же пейзаж. Нажмите на сцену — откроется снаряжение.</p>
  <p><b>✨ Божественные моменты.</b> Раз в 5–10 минут (на ×1) случается что-то, где решаете вы: 2–3 кнопки, одна всегда «Ничего не делать». Кнопки с 🔥 тратят веру и срабатывают наверняка, с 🎲 — проверка характеристики героя (бросок d20 и числа видны в дневнике). Не ответили за 2,5 мин — герой решит сам. В бою и в пещере момент ждёт, пока вы освободитесь.</p>
  <p><b>🙏 Развилки.</b> Иногда вместо момента герой молится и просит совета. Не ответили — решит сам (обычно глупо). Послушается ли он — зависит от <b>доверия</b>.</p>
  <p><b>📣 Глас.</b> Ключевые слова: «лечись», «бей», «копай», «проповедуй», «в город», «беги», «вперёд», «отдыхай».</p>
  <p><b>⛪ Паства.</b> Вера растёт с корнем из паствы. Паству приносят проповеди героя (Харизма!), ливни, развилки, дуэли и чудеса. Храм строится по частям: каждый уровень даёт веру, её запас, бесплатный ночлег и +1 КД на каждые 2 уровня. Солдаты армии стоят веры и 2 последователей, но помогают в дуэлях и событиях.</p>
  <p><b>😇 Характер бога.</b> Добрые поступки и силы света сдвигают его к «доброму» (силы света на 20% дешевле, паства растёт сама), кары — к «гневному» (кары дешевле, молния сильнее, солдаты дешевле).</p>
  <p><b>🏛 Война за Олимп.</b> Мир поделён на 14 регионов (лес, города, горы, болота, берег…), в каждом свои души. Регион принадлежит богу, у которого там больше всего верующих (не меньше 12% жителей), и даёт ему <b>+9 веры в час</b> и <b>свой бонус</b> (лес — добыча чаще, Годград — покупки дешевле, Понты — продажа дороже и т. д.). Ваши души растут, когда <b>герой ходит и проповедует в регионе</b> и побеждает там врагов; ещё помогают <b>храмы региона</b> (обращают сами и защищают), <b>штурм армией</b> (солдаты из «Паствы») и <b>дуэль богов за регион</b>. Отправить героя: кнопка на регионе или глас «иди в лес». Восемь богов-соперников тоже обращают души и иногда штурмуют ваши земли — в дневнике будет «⚠ Бог … обращает души в …». Без присмотра души остывают медленно (около 6% в сутки), так что день отсутствия не страшен. <b>Сезон — 4 недели</b>: каждый час вы получаете очки влияния (ОВ) за свои регионы и всех своих душ. В конце <b>топ-7 занимают троны Олимпа</b>: титул, рамка и «⚡ Олимпийский дар» на весь следующий сезон; затем карта сбрасывается, а герой, вещи, главный храм и армия остаются. Карта, таблица и хроника — во вкладке «🏛 Олимп».</p>
  <p><b>🧭 Где что.</b> Главный экран — «сцена бога»: сверху вера, уровень бога и скорость, в центре живая сцена местности с фигуркой героя и маршрутом Город → Лес → Подземелье → Город и дневник. Внизу — вкладки <b>Силы | Паства | Арена | Олимп | Герой</b>. Ваши вмешательства подсвечены в дневнике синим 🙏; важные события крупнее; запись с ▾ можно развернуть (броски кубиков, ход боя). Карта мира, таблица сезона, чат, пещеры и соперники — в «Олимпе», храм, чудеса и армия — в «Пастве», характеристики, снаряжение и рюкзак — в «Герое» (и по кнопке «📋»). Настройки (звук, сохранение, имена) — ⚙ сверху.</p>
  <p><b>⚔ Бой по зонам</b> (как в старом добром «Бойцовском клубе»). Каждый ход выберите <b>одну зону удара</b> (голова, грудь, живот, пояс, ноги) и <b>блок</b> (обычно 2 соседние зоны; воин и жрец закрывают 3, плут бьёт дважды, но закрывает 1). Противник выбирает одновременно. Кнопка «👁 Подсказать» (6 веры, раз за ход) подсмотрит, бьёт ли самый опасный враг в верх или в низ. Попал в блок — промах; ЛОВ даёт уворот, ИНТ/МДР — криты, сила и оружие — урон, доспех защищает (лучше всего грудь). 30 секунд на ход, потом герой решит сам по привычке. «🤖 Автобой» — пусть дерётся сам. До 3 сил бога за бой, 1 за ход.</p>
  <p><b>🤺 Арена</b> — вкладка с заявками: дуэли 1нс1, группы 3нс3 и 5нс5, хаотичные бои. Принимайте чужие или подавайте свои. За бои — опыт, золото и рейтинг; после поражения — травмы (штраф к характеристике, лечатся временем, отдыхом и храмом). <b>⚜ Дуэль богов</b> — тот же бой, но соперничающий бог тоже колдует.</p>
  <p><b>🏰 Пещеры</b> — карта 5×5: ведите отряд по комнатам, ищите 🗝 ключ и бейте 👑 босса. Это испытание: бесплатного лечения почти нет (один ⛲ источник и жрец), чем глубже — тем злее, 💀 элита на половине здоровья звереет. Боссы <b>объявляют</b> страшный удар по зоне — поставьте туда блок, иначе удар в 2,5 раза сильнее. Можно лечить отряд силой «Исцеление» между комнатами (раз за пещеру) и <b>отступить с добычей</b> (60% золота и опыта, все вещи). Если отряд разбит — героя вынесут, оставив 30%. Награда за босса — гарантированная редкая вещь и много опыта. Пещера не чаще раза в 4 часа. <b>💬 Чат</b> — пока с ботами, но они стараются. <b>🌍 Мировые события</b> — общий босс для всех богов.</p>
  <p>Обычные стычки с монстрами герой решает сам, но кнопкой «🎯 Бой под контроль» можно взять любой бой в свои руки.</p>
  <p class="muted">Пока вас нет, герой живёт сам (примерно в 0,75 темпа, до 24 часов за раз), а по возвращении вас ждёт сводка. Скорость ×1–×10 ускоряет жизнь героя; таймеры решений ускоряются не больше чем в 2 раза.</p>
  <div class="btns"><button class="btn" data-act="closeModal">Понятно!</button></div>`);
}
