<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1638">
<meta name="description" content="БогоДел — игра, где вы бог, а ваш герой живёт сам. Развилки, дуэли богов, подземелья с отрядом.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="БогоДел">
<title>БогоДел — бог, которому не всё равно</title>
<style>
:root{
  --bg1:#14122b;--bg2:#2a1f45;--parch:#f6ecd4;--parch2:#efe0bd;--ink:#3a2a18;--ink2:#6b5233;
  --gold:#c9962b;--gold2:#e8c063;--red:#b8412f;--green:#4c8a3c;--blue:#3d6fa8;--purple:#7b4fa8;
  --shadow:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:#14122b}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(ellipse at top,#3b2c66 0%,var(--bg2) 35%,var(--bg1) 100%) fixed;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 10% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 70% 30%,#ffe 50%,transparent 51%),radial-gradient(1px 1px at 85% 80%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 50% 10%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 92% 12%,#fff 50%,transparent 51%);}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:40;padding:8px 14px 10px;
  background:linear-gradient(180deg,#1c1638fa,#221a42f5);border-bottom:2px solid var(--gold);color:#f3e6c4;box-shadow:var(--shadow)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hspacer{flex:1}
.logo{font-family:Georgia,serif;font-size:22px;color:var(--gold2);letter-spacing:.5px;white-space:nowrap}
.logo small{display:block;font-size:11px;color:#b9a77d;letter-spacing:0}
.godInfo{display:flex;flex-direction:column;min-width:0}
.godInfo b{font-size:15px}.godInfo span{font-size:12px;color:#cdb98b}
.hrow2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.5fr) minmax(0,1fr);gap:8px 12px;margin-top:8px;align-items:center}
.meter{position:relative;height:28px;border-radius:14px;background:#0b0a1c;overflow:hidden}
.meter>i{position:absolute;left:0;top:0;bottom:0;transition:width .3s;border-radius:14px 0 0 14px}
.meter>span{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:100%;padding:0 8px;
  font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter.faithM{border:2px solid #7fb4ff;box-shadow:0 0 12px #4a7bd088}
.meter.faithM>i{background:linear-gradient(90deg,#2f5fc0,#5f9ae8 60%,#a8dcff)}
.meter.gxpM{height:22px;border:1px solid #c9962b}
.meter.hpM{border:2px solid #ff8a7a;box-shadow:0 0 10px #c0392b77}
.meter.hpM>i{background:linear-gradient(90deg,#8e1f14,#d63a2a 60%,#ff7a5c)}
.meter.hpM>span small{font-weight:600;opacity:.85;margin-left:6px;font-size:.85em}
.meter.hpM.low{animation:hpLow 1.2s infinite}
.meter.hpM.dead{border-color:#777;box-shadow:none;background:#2a2a2a}
.meter.hpM.dead>i{background:#555}
.meter.hpM.hit{animation:hpHit .6s}
@keyframes hpHit{0%,100%{transform:none}20%{transform:translateX(-3px);box-shadow:0 0 0 4px #ff3b2a,0 0 18px #ff3b2a}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
@keyframes hpLow{0%,100%{box-shadow:0 0 6px #c0392b77}50%{box-shadow:0 0 14px #ff3b2a}}
.meter.gxpM>i{background:linear-gradient(90deg,#8a5c10,#e0b048)}
.meter.gxpM>span{font-size:12px}
.meter.flash{animation:flashRed .7s}
@keyframes flashRed{0%,100%{box-shadow:0 0 12px #4a7bd088}30%{box-shadow:0 0 0 4px #ff4a3a,0 0 18px #ff4a3a}}
.faithChip{display:inline-flex;align-items:center;gap:4px;background:#1f3a6e;color:#fff;border-radius:10px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.speed{display:flex;gap:4px;align-items:center;font-size:12px}
.speed button,.hbtn{background:#3a2e5e;color:#f3e6c4;border:1px solid #6b5a99;border-radius:8px;padding:5px 9px}
.speed button.on{background:var(--gold);color:#2a1d08;border-color:var(--gold2);font-weight:700}
.hbtn:hover,.speed button:hover{filter:brightness(1.2)}
.bar{height:10px;background:#00000033;border-radius:6px;overflow:hidden;border:1px solid #0003}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .3s}
.bar.hp>i{background:linear-gradient(90deg,#c0392b,#e74c3c)}
.bar.xp>i{background:linear-gradient(90deg,#6c8f2f,#a3c94a)}
.bar.faith>i{background:linear-gradient(90deg,#4a7bd0,#9fd0ff)}
.bar.gxp>i{background:linear-gradient(90deg,#b07a1c,#f0c860)}
.bar.trust>i{background:linear-gradient(90deg,#8a5cc0,#d29bff)}
.bar.quest>i{background:linear-gradient(90deg,#3b8a7a,#6fd6be)}
.bar.time>i{background:linear-gradient(90deg,#e67e22,#f1c40f);transition:width .25s linear}
main{display:grid;gap:18px;padding:18px;max-width:1280px;margin:0 auto;
  grid-template-columns:minmax(0,1fr) 390px;grid-template-areas:"center right";align-items:start}
#colCenter{grid-area:center;display:flex;flex-direction:column;gap:16px;min-width:0}#colRight{grid-area:right;position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));border-radius:14px;box-shadow:var(--shadow);padding:14px;border:1px solid #d9c290;position:relative}
.card h2{font-size:18px;color:#5a3b12;margin-bottom:8px;border-bottom:1px dashed #c8ad74;padding-bottom:6px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:4px 0}
.row span:first-child{color:var(--ink2)}
.muted{color:var(--ink2);font-size:12px}
.stat{margin:8px 0}.stat label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.inv{list-style:none;padding:0;margin:6px 0 0;font-size:13px;max-height:170px;overflow:auto}
.inv li{padding:2px 0;border-bottom:1px dotted #d4bd8b}
.btn{background:linear-gradient(180deg,#e8c063,#c9962b);color:#2b1d07;border:1px solid #a77b20;border-radius:9px;padding:7px 11px;font-weight:600;box-shadow:0 2px 0 #8a6418}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.btn.red{background:linear-gradient(180deg,#e0705c,#b8412f);color:#fff;border-color:#8c2e20;box-shadow:0 2px 0 #7a2618}
.btn.green{background:linear-gradient(180deg,#86c46d,#4c8a3c);color:#fff;border-color:#36662a;box-shadow:0 2px 0 #2f5a24}
.btn.blue{background:linear-gradient(180deg,#7fb0e8,#3d6fa8);color:#fff;border-color:#2c5280;box-shadow:0 2px 0 #24456b}
.btn.small{padding:4px 8px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* diary */
#diary{max-height:62vh;overflow:auto;padding-right:4px}
.entry{display:flex;gap:8px;padding:7px 4px;border-bottom:1px dotted #d1b985;font-size:14.5px;line-height:1.4;animation:fadeIn .5s}
.entry .tm{color:#9a7f55;font-size:11px;min-width:38px;padding-top:2px}
.entry.fight .tx{color:#7a2a1c}.entry.loot .tx{color:#5b4a08}.entry.god .tx{color:#244f8a;font-style:italic}
.entry.fork .tx{color:#5e2f86}.entry.duel .tx{color:#8a3a10}.entry.event .tx{color:#0f5d55;font-weight:600}.entry.level .tx{color:#2f6b20;font-weight:700}
.fx{font-size:12px;color:#7d6340;white-space:nowrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #e8c06388,var(--shadow)}50%{box-shadow:0 0 0 8px #e8c06300,var(--shadow)}}
/* voice */
.voice{display:flex;gap:6px;margin-bottom:8px}
.voice input{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid #c8ad74;background:#fffaf0;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{font-size:12px;padding:3px 8px;border-radius:12px;border:1px solid #c8ad74;background:#fff6e0;color:#5a3b12}
.chip:hover{background:#ffe9b8}
/* fork */
.card.fork{border:2px solid var(--purple);background:linear-gradient(180deg,#f7eefe,#eadcf6);animation:pulse 2s infinite}
.fork h2{color:#5e2f86;border-color:#b993dc}
.fork .q{font-size:15.5px;line-height:1.45;margin:6px 0 10px}
.fork .opts{display:flex;flex-direction:column;gap:7px}
.fork .opts .btn{text-align:left;background:linear-gradient(180deg,#fff,#efe4fb);border-color:#a37fcb;box-shadow:0 2px 0 #8a68b0;color:#3d1f5c}
.tag{font-size:11px;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.tag.kind{background:#fff1b8;color:#7a5b00}.tag.wrath{background:#ffd5cc;color:#8c2e20}.tag.neutral{background:#e3e3e3;color:#555}
/* duel */
.card.duel{border:2px solid var(--red);background:linear-gradient(180deg,#fff2ea,#f6dccd)}
.duel h2{color:#8c2e20;border-color:#e2a48f}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0}
.fighter{background:#ffffff88;border-radius:10px;padding:8px;font-size:13px}
.fighter b{font-size:14px}
.vsx{font-family:Georgia,serif;font-size:26px;color:var(--red);font-weight:700}
.dlog{max-height:150px;overflow:auto;font-size:13px;background:#fff8;border-radius:8px;padding:6px 8px;margin-top:8px}
.dlog div{padding:2px 0;border-bottom:1px dotted #e0bfae}
.dlog .foe{color:#8c2e20}.dlog .me{color:#244f8a}.dlog .sys{color:#555;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.queued{font-size:12px;color:#244f8a;margin-top:4px;min-height:16px}
/* world event */
.card.wevent{border:2px solid #1d8a7e;background:linear-gradient(180deg,#e9fbf7,#cdeee6)}
.wevent h2{color:#0f5d55;border-color:#86cfc3}
.evlist{font-size:13px;max-height:190px;overflow:auto;margin-top:8px}
.evlist .r{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:3px 0;border-bottom:1px dotted #9fd3c9}
.evlist .r.me{font-weight:700;color:#0f5d55}
.vote.on{outline:3px solid #0f5d55}
/* tabs */
.tabs{display:flex;gap:4px;margin:-4px 0 10px}
.tabs button{flex:1;padding:7px 4px;border:1px solid #c8ad74;background:#efe0bd;border-radius:9px;color:#5a3b12;font-weight:600}
.tabs button.on{background:#5a3b12;color:#f6ecd4}
.branch{margin-bottom:10px;border-radius:10px;padding:8px;background:#ffffff66;border:1px solid #dcc79a}
.branch h3{font-size:14px;margin-bottom:6px}
.branch.light h3{color:#9a7400}.branch.wrath h3{color:#a3311f}.branch.nature h3{color:#3b7a2c}
.skill{display:grid;grid-template-columns:32px 1fr auto;gap:6px 8px;align-items:center;padding:6px 0;border-top:1px dotted #d6bf8e}
.skill:first-of-type{border-top:0}
.skill .ic{font-size:22px;text-align:center}
.skill .nm{font-weight:700;font-size:14px}.skill .ds{font-size:11.5px;color:var(--ink2);line-height:1.3}
.skill.locked{opacity:.55}
.skill .sb{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.pips{color:var(--gold);letter-spacing:1px;font-size:12px}
.align{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#a3311f,#cfcfcf 50%,#e8c063);margin:6px 0 2px}
.align i{position:absolute;top:-4px;width:6px;height:20px;background:#2a1d08;border-radius:3px;transform:translateX(-50%);transition:left .4s}
.alignLbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)}
.box{background:#ffffff66;border:1px solid #dcc79a;border-radius:10px;padding:9px;margin-bottom:10px;font-size:13.5px}
.box h3{font-size:15px;color:#5a3b12;margin-bottom:4px}
.big{font-size:22px;font-weight:700;font-family:Georgia,serif;color:#5a3b12}
.rival{display:grid;grid-template-columns:1fr auto;gap:4px;padding:7px 0;border-bottom:1px dotted #d6bf8e;font-size:13px}
/* modal & toasts */
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
#modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
#modal input{width:100%;padding:9px;border-radius:9px;border:1px solid #c8ad74;margin:4px 0 10px;font:inherit;background:#fffaf0}
#toasts{position:fixed;right:14px;bottom:14px;z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toast{background:#2a1f45;color:#f3e6c4;border:1px solid var(--gold);padding:9px 12px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;animation:fadeIn .3s}
.deadbox{background:#3a2a2a;color:#f6d6d0;border-radius:10px;padding:10px;margin:8px 0;font-size:13.5px}
/* v3: предметы, лист героя, черты, подземелье */
#colCenter>div:empty{display:none}
#updBar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:45;display:none;gap:10px;align-items:center;background:#2a1f45;color:#f3e6c4;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:14px;max-width:calc(100vw - 20px)}
#updBar.on{display:flex}
#modal textarea{width:100%;min-height:110px;font:12px/1.35 monospace;border-radius:9px;border:1px solid #c8ad74;background:#fffaf0;padding:8px;margin:4px 0}
.pwaNote{font-size:12.5px;color:var(--ink2);margin-top:6px}
.r0{color:#555}.r1{color:#2e8b3a}.r2{color:#2a64c4}.r3{color:#8a3cc4}.r4{color:#d9731a}
.r2,.r3,.r4{font-weight:700}
.cursed{color:#b8412f!important}
.eq{list-style:none;padding:0;margin:4px 0 0;font-size:13px}
.eq li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px;align-items:center;padding:3px 0;border-bottom:1px dotted #d6bf8e}
.eq li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:6px 0}
.stgrid div{background:#ffffff88;border:1px solid #dcc79a;border-radius:8px;text-align:center;padding:4px 0;font-size:11px;line-height:1.2}
.stgrid b{display:block;font-size:15px;color:#5a3b12}
.stgrid .pr{border-color:var(--gold);background:#fff6d8}
.sheet h3{font-size:15px;margin:10px 0 4px;color:#5a3b12}
.sheet .itm{padding:5px 0;border-bottom:1px dotted #d6bf8e;font-size:13px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}.sheet td{padding:3px 4px;border-bottom:1px dotted #e0cfa5}
.entry.rare .tx{color:#2a64c4;font-weight:700}.entry.death .tx{color:#7a1a10;font-weight:700}
.card.feat{border:2px solid var(--gold);background:linear-gradient(180deg,#fffbe9,#f5e7bf);animation:pulse 2s infinite}
.feat h2{color:#7a5b00}
.feat .opts{display:flex;flex-direction:column;gap:7px}
.feat .opts .btn{text-align:left}
.card.dun{border:2px solid #4b3a7a;background:linear-gradient(180deg,#efeaf9,#dcd3ef)}
.dun h2{color:#3d2a6e;border-color:#a99ad0}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:6px 0}
.party .pm{background:#ffffff88;border-radius:8px;padding:5px 7px;font-size:12px}
.party .pm.me{outline:2px solid #3d2a6e}
.rooms{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 6px;font-size:16px}
.rooms span{opacity:.4}.rooms span.done{opacity:1}.rooms span.cur{opacity:1;outline:2px solid #3d2a6e;border-radius:6px}
.dun .opts{display:flex;flex-direction:column;gap:6px}
.dun .opts .btn{text-align:left}
.dun .opts .btn.on{outline:3px solid #3d2a6e}
.tag.cls{background:#ddd3f5;color:#3d2a6e}.tag.chk{background:#e6eef8;color:#244f8a}
.restbox{background:#e6eef8;border-radius:10px;padding:8px;margin:8px 0;font-size:13px}
#modal select{width:100%;padding:8px;border-radius:9px;border:1px solid #c8ad74;margin:4px 0 4px;font:inherit;background:#fffaf0}
.desc{font-size:12px;color:var(--ink2);margin-bottom:10px;min-height:16px}
/* ===== v4: бой по зонам ===== */
.card.zf{border:2px solid var(--red);background:linear-gradient(180deg,#fff4ec,#f5dccb)}
.zf h2{color:#8c2e20;border-color:#e2a48f;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zf h2 .muted{font-size:13px;font-weight:400}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.team{background:#ffffff8c;border-radius:10px;padding:5px 6px;min-width:0}
.team h4{margin:0 0 3px;font-size:12px;color:#6b5233;text-transform:uppercase;letter-spacing:.04em}
.fr{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:3px 5px;margin:1px 0;font:inherit;font-size:12.5px;color:inherit;cursor:default}
.fr .nm{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}.fr .nm b{overflow:hidden;text-overflow:ellipsis}
.fr .bar{height:6px;margin-top:2px}
.fr.dead{opacity:.45;text-decoration:line-through}
.fr.me b{color:#244f8a}
.fr.tg{cursor:pointer}.fr.tg:hover{border-color:#e2a48f}
.fr.sel{border-color:var(--red);background:#ffe1d6;box-shadow:inset 3px 0 0 var(--red)}
.fr .tl{font-size:11px;color:#8c2e20;font-weight:700}
.zpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.body{display:flex;flex-direction:column;align-items:center;gap:3px;background:#ffffff70;border-radius:12px;padding:6px 4px}
.body h4{margin:0 0 2px;font-size:13px}
.body.atk h4{color:#8c2e20}.body.blk h4{color:#244f8a}
.zb{border:2px solid #c8ad74;background:#fffaf0;color:#3a2a18;font:inherit;font-size:13px;font-weight:600;min-height:40px;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;transition:background .12s}
.zb.head{width:52%;border-radius:50% 50% 42% 42%;min-height:46px}
.zb.chest{width:92%;border-radius:16px 16px 6px 6px}
.zb.belly{width:76%;border-radius:6px}
.zb.waist{width:70%;border-radius:6px 6px 10px 10px}
.zb.legs{width:62%;border-radius:6px 6px 14px 14px;min-height:48px}
.body.atk .zb.on{background:#e0573f;border-color:#8c2e20;color:#fff}
.body.blk .zb.on{background:#4d82c0;border-color:#244f8a;color:#fff}
.zb.tele{box-shadow:0 0 0 3px #f2b705}
.zb:disabled{opacity:.6;cursor:default}
.fctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fctl .go{flex:1 1 140px;font-size:16px;padding:10px}
.telewarn{background:#fff1b8;border:1px solid #e0b100;border-radius:8px;padding:5px 8px;font-size:13px;margin:6px 0;color:#6a4b00}
.flog{max-height:190px;overflow:auto;font-size:13px;background:#fff8;border-radius:8px;padding:6px 8px;margin-top:8px}
.flog div{padding:2px 0;border-bottom:1px dotted #e0bfae}

  if (h.restT > 0) { if (R() < .5) diary(pick(['Сплю. Снится, что я король. Король тоже спит.', 'Храплю так, что разбудил соседа. Он вызвал меня на дуэль. Сплю дальше.', 'Ворочаюсь. Под матрасом горошина. Я что, принцесса?'])); return; }
  const cured = healInjuries(h.restKind === 'temple' ? 'temple' : 'rest');
  const a = healHero(h.maxHp); h.shortRests = 2;
  diary('Выспался! Как заново родился, только без мучений.', 'level', `+${a} HP (долгий отдых)${cured ? `, травм вылечено: ${cured}` : ''}`);
  h.state = h.restKind === 'camp' ? 'road' : 'town';
}

/* ---------- Город ---------- */
const priceMul = () => (1 - .04 * mod(statVal('cha'))) * (hasFeat('trader') ? .85 : 1) * (curseOn('magnet') ? 1 : 1);
const sellMul = () => (1 + .04 * mod(statVal('cha'))) * (hasFeat('trader') ? 1.2 : 1) * (S.buffs.trade > 0 ? 1.5 : 1);
function townStep() {
  const h = S.hero, L = h.lvl;
  if (h.townStep === 0) {
    if (h.inv.length) {
      let sum = 0; for (const i of h.inv) sum += i.v * (!i.slot && h.race === 'gnome' ? 1.2 : 1);
      sum = Math.round(sum * sellMul());
      const names = h.inv.slice(0, 3).map(i => i.n).join(', ') + (h.inv.length > 3 ? ' и прочее' : '');
      h.gold += sum; h.inv = [];
      diary(`Пришёл в ${h.loc}. Продал добро (${names}).` + (S.buffs.trade > 0 ? ' Проклятые торговцы переплатили!' : ''), 'loot', `+${sum} 💰`);
    } else diary(`Пришёл в ${h.loc}. Продавать нечего, так что просто поглазел на витрины.`);
    if (curseOn('greed') && h.gold > 10) { const g = Math.ceil(h.gold * .05); h.gold -= g; diary(`Проклятие жадности заставило купить «${pick(ITEMS)}» за ${g} 💰. Зачем?!`, 'fight'); }
  } else if (h.townStep === 1) {
    if (h.hp < h.maxHp) {
      const cost = S.flock.temple >= 1 ? 0 : Math.round((4 + L * 3) * priceMul());
      if (h.gold >= cost) { h.gold -= cost; h.townStep++; startLongRest(cost ? 'inn' : 'temple'); return; }
    }
  } else if (h.townStep === 2) {
    const parts = [];
    const price = Math.max(3, Math.round((10 + 4 * L) * priceMul())); let bought = 0;
    while (h.potions < 3 && h.gold > price * 2) { h.gold -= price; h.potions++; bought++; }
    if (bought) parts.push(`Купил ${bought} ${plural(bought, 'зелье', 'зелья', 'зелий')} у подозрительного алхимика.`);
    if (R() < .5) {
      const it = makeItem(pick(['weapon', 'armor', 'amulet', 'ring']), L, R() < .25 ? 1 : 0); it.curse = null;
      const cost = Math.round(it.v * 2.5 * priceMul()), cur = h.eq[it.slot];
      if (h.gold >= cost * 1.2 && itemScore(it) > itemScore(cur) && !(cur && cur.curse)) { h.gold -= cost; equip(it, true); parts.push(`Купил «${it.n}» за ${cost} 💰.`); }
    }
    const rich = Math.round(250 * goldScale(L) * L);
    if (h.gold > rich) { const sp = Math.round((h.gold - rich * .5) * (.4 + R() * .3)); h.gold -= sp; parts.push(pick([`Закатил пир на весь ${h.loc} и потратил ${sp} 💰. Друзей стало много, денег — мало.`, `Проиграл в кости ${sp} 💰. Кости были гномьи, с подвохом.`, `Купил титул «Почётный герой квартала» за ${sp} 💰. Табличку повесили криво.`, `Вложил ${sp} 💰 в «гарантированно прибыльную» гильдию. Гильдия исчезла.`])); }
    diary(parts.length ? parts.join(' ') : 'Побродил по рынку. Всё дорого, всё блестит.', parts.length ? 'loot' : '');
  } else {
    if (h.trust < 20) diary('Хотел пожертвовать храму, но передумал: а вдруг бога нет?', 'god');
    else {
      const don = Math.floor(Math.max(0, h.gold - 20 * goldScale(L)) * (h.trust / 100) * .3 * (hasFeat('devout') ? 1.5 : 1));
      if (don > 0) { h.gold -= don; const f = Math.max(1, Math.round(don * .25 / goldScale(L))); addFaith(f); diary(`Пожертвовал ${don} 💰 на храм моего бога. Пусть порадуется.`, 'god', `+${f} веры`); }
      else diary('Помолился у алтаря моего бога. Денег нет, зато искренне.', 'god');
    }
    h.state = 'road'; h.loc = pick(PLACES); h.townStep = 0;
    diary(`Отправляюсь дальше. Следующая цель: ${h.loc}.`);
    return;
  }
  h.townStep++;
}
function preach() {
  const h = S.hero;
  if (curseOn('chatty') && R() < .3) { const n = Math.min(1, Math.floor(S.flock.fol)); S.flock.fol -= n; diary('Проклятие болтливости: три часа рассказывал прохожим про свои мозоли. Один последователь сбежал.', 'god', n ? '−1 паствы' : ''); return; }
  let n = 1 + Math.max(0, mod(statVal('cha'))) + (h.cls === 'cleric' ? Math.max(0, mod(statVal('wis'))) : 0) + (h.trust > 70 ? 1 : 0) + eqCount('preach');
  if (hasFeat('preacher')) n *= 2;
  S.flock.fol += n;
  diary(`Рассказал прохожим о величии моего бога. ${n} ${plural(n, 'человек уверовал', 'человека уверовали', 'человек уверовали')}.`, 'god', `+${n} паствы`);
}
function heroStep() {
  const h = S.hero;
  if (h.state === 'dead' || h.state === 'duel' || h.state === 'dungeon' || S.fight) return;
  if (eqHas('regen') && h.hp < h.maxHp) healHero(h.maxHp * .02);
  if (h.state === 'fight') return fightStep();
  if (h.state === 'rest') return restStep();
  if (h.state === 'town') return townStep();
  if ((h.hp < h.maxHp * .4 && h.shortRests <= 0) || h.inv.length >= 10) {
    h.state = 'town'; h.townStep = 0; h.loc = pick(TOWNS);
    diary(h.hp < h.maxHp * .4 ? `Здоровье на исходе. Иду в ${h.loc} отлежаться.` : `Рюкзак трещит по швам. Пора в ${h.loc} на рынок.`);
    return;
  }
  if (h.hp < h.maxHp * .6 && shortRest()) return;
  const r = R(), fightP = curseOn('magnet') ? .45 : .28;
  if (r < fightP) startFight();
  else if (r < fightP + .10 + (hasFeat('treasure') ? .04 : 0)) { if (R() < .2) lootDrop(0, 'Нашёл в кустах'); else { const it = addItem(); diary(pick(['Нашёл под кустом «{i}». Беру, в хозяйстве пригодится.', 'В канаве лежал «{i}». Теперь он лежит в рюкзаке.', 'Выиграл в напёрстки «{i}». Напёрсточник плакал.']).replace('{i}', it.n), 'loot'); } }
  else if (r < fightP + .14 + (hasFeat('preacher') ? .03 : 0)) preach();
  else if (r < fightP + .22) diary(R() < .5 ? pick(CLASS_ROAD[h.cls]) : pick(h.trust < 35 ? THOUGHTS_LOW : THOUGHTS_HIGH), R() < .5 ? '' : 'god');
  else { if (R() < .3) h.loc = pick(PLACES); diary(pick(ROAD)); questProgress(Math.round(rnd(4, 9) * (h.cls === 'ranger' ? 1.3 : 1) * (hasFeat('swift') ? 1.25 : 1))); return; }
  questProgress(rnd(1, 2));
}

/* ---------- Силы бога вне дуэли ---------- */
function usePower(id) {
  if (S.fight && S.fight.phase === 'turn') return fightPower(id);

  const h = S.hero, p = POWERS[id], L = S.god.skills[id] || 0, mu = pmult(id);
  if (!L) return toast('Эта сила ещё не изучена.');
  if (h.state === 'dead') return toast('Герой мёртв. Сначала воскресите его.');
  const c = powerCost(id); if (S.god.faith < c) return toast('Не хватает веры.');
  S.god.faith -= c; shiftAlign(p.al); addGxp(c / 2);
  const m = h.monster, lv = h.lvl;
  switch (id) {
    case 'heal': { const a = healHero(h.maxHp * .3 * mu); addTrust(2); const cu = h.inj.length ? healInjuries('one') : 0; diary('Почувствовал тёплый свет с небес. Раны затянулись. Спасибо, о {god}!', 'god', `+${a} HP, +2 доверия${cu ? ', травма исцелена' : ''}`); break; }
    case 'bless': S.buffs.luck += 300 * mu; addTrust(1); diary('На меня снизошло благословение! Чувствую, что сегодня всё получится.', 'god', '🍀 удача на ' + Math.round(5 * mu) + ' мин'); break;
    case 'shield': S.buffs.shield += 300 * mu; diary('Вокруг меня засиял божий щит. Комары в ярости.', 'god', '🛡 щит на ' + Math.round(5 * mu) + ' мин'); break;
    case 'bolt':
      if (m) { const d = Math.round((10 + 6 * lv) * mu * (S.god.align <= -30 ? 1.3 : 1)); m.hp -= d; addTrust(1); diary(`С небес ударила молния и поджарила противника «${m.n}» (−${d})! Мой бог на моей стороне!`, 'god'); if (m.hp <= 0) winFight(); }
      else { const d = damageHero(h.maxHp * .12, 'Убит молнией собственного бога. Ирония.'); addTrust(-4); diary('В меня ударила молния. Я ничего не сделал! Наверное, это знак. Или бог промахнулся.', 'god', `−${d} HP, −4 доверия`); }
      break;
    case 'curse':
      if (m) { m.curse = true; diary(`Противник «${m.n}» внезапно покрылся прыщами и потерял волю к победе. Проклятие!`, 'god'); }
      else { S.buffs.trade += 1800 * mu; diary('Все торговцы в округе почему-то начали заикаться и переплачивать. Странно.', 'god', 'торговля ×1.5'); }
      break;
    case 'quake':
      if (m) { const d = Math.round((20 + 12 * lv) * mu); m.hp -= d; const hd = damageHero(h.maxHp * .05); diary(`Земля разверзлась под противником «${m.n}» (−${d})! Меня тоже немного тряхнуло.`, 'god', `−${hd} HP`); if (m.hp <= 0 && h.state === 'fight') winFight(); }
      else { const g = Math.round(rnd(20, 60) * mu * goldScale(lv)); h.gold += g; diary('Землетрясение! Из трещины вылез сундук с золотом и, кажется, гном. Гном убежал, сундук остался.', 'loot', `+${g} 💰`); }
      break;
    case 'rain': { const a = healHero(h.maxHp * .12 * mu); const n = rnd(1, 3); S.flock.fol += n; diary('Пошёл тёплый ливень. Я освежился, а крестьяне так обрадовались урожаю, что уверовали.', 'god', `+${a} HP, +${n} паствы`); break; }
    case 'luck': { const g = Math.round(rnd(15, 40) * mu * goldScale(lv)); h.gold += g; if (R() < .4 + .1 * L) lootDrop(.5 * mu, 'Подкова удачи привела к кладу'); else { const it = addItem(); diary(`Споткнулся о подкову и упал лицом в клад! «${it.n}» и монеты — мои.`, 'loot'); } diary('Удача сегодня на моей стороне!', 'god', `+${g} 💰`); break; }
    case 'beast':
      if (m) { if (m.tier <= lv + 1) { diary(`Из леса выбежал божий медведь и разорвал противника «${m.n}» в клочья. Медведь ушёл, не попрощавшись.`, 'god'); m.hp = 0; winFight(); } else { const d = Math.round((15 + 10 * lv) * mu); m.hp -= d; diary(`Божий медведь вцепился в противника «${m.n}» (−${d}), но тот оказался крепким.`, 'god'); if (m.hp <= 0) winFight(); } }
      else { const it = addItem(); diary(`Ко мне вышел медведь, положил к ногам «${it.n}» и ушёл. Бог посылает странные подарки.`, 'god'); }
      break;
  }
}
function learn(id) {
  const g = S.god, p = POWERS[id], L = g.skills[id] || 0;
  if (g.sp < 1 || L >= 3 || g.lvl < p.req || (p.pre && !(g.skills[p.pre] >= 1))) return;
  g.sp--; g.skills[id] = L + 1;
  toast(L ? `«${p.n}» улучшено до ${L + 1} уровня` : `Изучено: «${p.n}»`);

/* ---------- Глас божий ---------- */
const VOICE = [
  { re: /отдых|привал|поспи|спать|спи\b|ночлег/i, f: v => { const h = S.hero;
      if (h.state === 'town') { if (h.hp >= h.maxHp) return ['Бог велит отдыхать, но я и так бодр как огурец.', '']; h.townStep = 2; startLongRest(S.flock.temple >= 1 ? 'temple' : 'inn'); return [`Услышал «${v}». Иду спать — бог плохого не посоветует.`, '']; }
      if (h.state === 'road') { if (h.shortRests > 0 && h.hp < h.maxHp) { shortRest(); return [`«${v}» — понял, привал!`, '']; } startLongRest('camp'); return [`«${v}» — разбиваю лагерь прямо здесь.`, '']; }
      return ['Хотел отдохнуть, но сейчас немного занят.', '']; } },
  { re: /леч|здоров|зелье/i, f: v => { const h = S.hero; if (h.potions > 0 && h.hp < h.maxHp * .7) { h.potions--; const a = healHero(h.maxHp * .4); return [`Услышал «${v}». Выпил зелье.`, `+${a} HP`]; } const a = healHero(h.maxHp * .1); return [`Услышал глас: «${v}». Приложил подорожник.`, `+${a} HP`]; } },
  { re: /бей|руби|атак|убей|дерись|сражай|мочи/i, f: v => { const m = S.hero.monster; if (m) { const d = Math.round(sheet().avg * 1.5); m.hp -= d; return [`Глас велит: «${v}»! Ударил противника «${m.n}» в полную силу (−${d}).`, '']; } if (S.hero.state === 'road') { startFight(); return ['Раз бог велит драться — найду с кем!', '']; } return ['Хотел подраться, но вокруг никого подходящего.', '']; } },
  { re: /коп|клад|золот|деньг|сокров/i, f: v => { if (check('wis', 12).ok) { const g = Math.round(rnd(8, 30) * goldScale(S.hero.lvl)); S.hero.gold += g; return [`По велению «${v}» копал землю и нашёл монеты!`, `+${g} 💰`]; } return ['Копал. Выкопал червяка. Назвал его Гошей. Гоша теперь мой друг.', '']; } },
  { re: /моли|верь|храм|пропов|вера|паств/i, f: v => { if (S.hero.state === 'road' || S.hero.state === 'town') { preach(); addFaith(3); return [`Услышав «${v}», произнёс пламенную речь на пеньке.`, '+3 веры']; } return ['Помолился про себя.', '']; } },
  { re: /город|домой|торг|прода|рын/i, f: v => { if (S.hero.state === 'road') { S.hero.state = 'town'; S.hero.townStep = 0; S.hero.loc = pick(TOWNS); return [`Бог сказал «${v}» — разворачиваюсь в ${S.hero.loc}.`, '']; } return ['Хотел в город, но сейчас немного занят.', '']; } },
  { re: /беги|отступ|спаса|удира/i, f: v => { if (S.hero.monster) { S.hero.monster = null; S.hero.state = 'road'; return ['Сбежал с поля боя по божьему велению. Это не трусость, это стратегия.', '']; } return ['Побежал. Бежал долго. От кого — так и не понял.', '']; } },
  { re: /квест|задан|иди|вперёд|вперед|цел/i, f: v => { if (S.hero.state === 'rest') { S.hero.state = 'road'; S.hero.restT = 0; } questProgress(10); return [`«${v}» — бодро зашагал к цели!`, '+10% задания']; } }
];
function voice(text) {
  text = (text || '').trim().slice(0, 80); if (!text) return;
  if (S.god.faith < 5) return toast('Нужно 5 веры.');
  if (S.hero.state === 'dead') return toast('Мёртвые плохо слышат.');
  if (S.hero.state === 'duel' || S.hero.state === 'dungeon') return toast('Герой занят — используйте силы прямо в дуэли или подземелье.');
  if (S.fight) return toast('Идёт бой — командуйте зонами и силами бога.');
  S.god.faith -= 5; addGxp(2);
  if (R() > obeyChance()) { diary(`Услышал что-то вроде «${text}», но сделал вид, что это ветер.`, 'god'); return; }
  const v = VOICE.find(x => x.re.test(text));
  if (!v) { diary(pick([`Услышал глас: «${text}». Долго думал. Решил, что это рецепт борща.`, `С небес донеслось «${text}». Записал в дневник. Перечитал. Ничего не понял.`, `Бог сказал: «${text}». Кивнул с умным видом.`]), 'god', '+1 доверия'); addTrust(1); return; }
  const [t, f] = v.f(text); addTrust(1); diary(t, 'god', f);
  if (S.hero.monster && S.hero.monster.hp <= 0) winFight();
}

/* ---------- Развилки ---------- */
function startFork(idx) {
  if (S.fork || S.fight || S.dun || S.hero.state === 'dead' || S.hero.state === 'duel' || S.hero.state === 'dungeon') return false;
  let i = idx;
  if (i === undefined) { const free = FORKS.map((_, k) => k).filter(k => !S.forkHist.includes(k)); i = pick(free.length ? free : FORKS.map((_, k) => k)); }
  S.forkHist.push(i); if (S.forkHist.length > 10) S.forkHist.shift();
  S.fork = { i, t: 30, T: 30, cls: R() < .4 }; S.timers.fork = Math.max(S.timers.fork, 300);
  S.stats.forks++;
  diary('🙏 Молюсь: ' + FORKS[i].t, 'fork');
  toast('🙏 Герой молится и ждёт вашего решения!');
}
function forkOptions(fk) { const f = FORKS[fk.i], o = f.o.slice(); if (fk.cls) { const c = CLASS_FORK[S.hero.cls]; o.push({ l: c.l, a: 0, clsOpt: true }); } return o; }
function resolveOption(fi, k) {
  const f = FORKS[fi];
  if (k >= f.o.length) { // классовый вариант
    const c = CLASS_FORK[S.hero.cls], chk = check(c.s, 13);
    const e = chk.ok ? { xp: 18, gold: 25, fol: S.hero.cls === 'cleric' || S.hero.cls === 'bard' ? 2 : 0 } : { hp: -15, xp: 6 };
    diary(`${CLASSES[S.hero.cls].ab}! ${chk.ok ? c.ok : c.no}`, 'fork', [chk.label, applyFx(e)].filter(Boolean).join(' · '));
    return;
  }
  const opt = f.o[k], st = (FORK_STATS[fi] || [])[k];
  let res = opt.r[opt.r.length - 1], label = '';
  if (opt.r.length > 1 && st) {
    const p = opt.r[0].p || .5, chk = check(st, clamp(Math.round(23 - p * 20), 5, 22));
    res = chk.ok ? opt.r[0] : opt.r[opt.r.length - 1]; label = chk.label;
  } else if (opt.r.length > 1) {
    const bonus = (S.buffs.luck > 0 ? .2 : 0) + (S.hero.trust > 80 ? .05 : 0);
    for (const r of opt.r) { if (r.p === undefined) { res = r; break; } if (R() < r.p + bonus) { res = r; break; } }
  }
  const fx = applyFx(res.e);
  diary(res.t, 'fork', [label, fx].filter(Boolean).join(' · '));
}
function answerFork(k) {
  if (!S.fork) return;
  const fk = S.fork, opts = forkOptions(fk); if (!opts[k]) return;
  S.fork = null; S.stats.forksAns++;
  const opt = opts[k];
  shiftAlign(opt.a); addGxp(10);
  if (R() < obeyChance()) { addTrust(2); diary(`Услышал волю бога: «${opt.l}». Так и сделаю!`, 'god'); resolveOption(fk.i, k); }
  else {
    const others = opts.map((_, j) => j).filter(j => j !== k); const j = pick(others);
    diary(`Бог сказал «${opt.l}», но я решил, что лучше знаю. Выбираю «${opts[j].l}».`, 'god');
    resolveOption(fk.i, j);
  }
}
function timeoutFork(offline) {
  if (!S.fork) return;
  const fk = S.fork, f = FORKS[fk.i]; S.fork = null;
  if (!offline) addTrust(-2);
  const pen = offline ? '' : '−2 доверия';
  if (R() < .7) diary(f.self.t, 'fork', [applyFx(f.self.e), pen].filter(Boolean).join(', '));
  else { const opts = forkOptions(fk), j = rnd(0, opts.length - 1); diary(`Бог промолчал. Выбрал наугад: «${opts[j].l}».`, 'fork', pen); resolveOption(fk.i, j); }
  if (SILENT) SILENT.c.forks++;
